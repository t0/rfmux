name: Build Wheels

on:
  workflow_call:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}${{ matrix.arch && format(' ({0})', matrix.arch) || '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            arch: x86_64
            cibw_archs: "x86_64"
            manylinux_image: manylinux_2_28
            # Insist on fastrx (x86_64 only -- see CMakeLists.txt): a release
            # wheel must not silently ship without it.
            cibw_config_settings: cmake.define.FASTRX_REQUIRED=ON
          - os: ubuntu-latest
            runner: ubuntu-24.04-arm
            arch: aarch64
            cibw_archs: "aarch64"
            manylinux_image: manylinux_2_28
          - os: windows-latest
            runner: windows-latest
            cibw_archs: "AMD64"
          - os: macos-latest
            runner: macos-latest
            cibw_archs: "x86_64 arm64"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.manylinux_image }}

          # fastrx (AF_XDP capture) is built opportunistically on x86_64 when
          # its prerequisites are present. For x86_64 wheel builds, we insist
          # (via matrix.cibw_config_settings above). manylinux_2_28's XDP and
          # io_uring prerequisites are too old, so we need to install newer
          # copies. Shared libraries are removed after each install so the
          # static ones get linked instead (liburing is built -fPIC to allow
          # this; it links into the _fastrx shared module).
          CIBW_BEFORE_ALL_LINUX: |
            if [ "$(uname -m)" = "x86_64" ]; then
                dnf -y install clang llvm m4 libpcap-devel \
                    elfutils-libelf-devel zlib-devel kernel-headers &&
                curl -fsSL https://github.com/xdp-project/xdp-tools/releases/download/v1.6.3/xdp-tools-1.6.3.tar.gz \
                    | tar -xz -C /tmp &&
                cd /tmp/xdp-tools-1.6.3 &&
                ./configure &&
                make -j"$(nproc)" libxdp &&
                make -C lib/libxdp install PREFIX=/usr LIBDIR=/usr/lib64 &&
                make -C lib/libbpf/src install install_uapi_headers \
                    PREFIX=/usr LIBDIR=/usr/lib64 BUILD_STATIC_ONLY=y &&
                cp headers/linux/if_xdp.h /usr/include/linux/ &&
                rm -f /usr/lib64/libxdp.so* /usr/lib64/libbpf.so* &&
                curl -fsSL https://github.com/axboe/liburing/archive/refs/tags/liburing-2.9.tar.gz \
                    | tar -xz -C /tmp &&
                cd /tmp/liburing-liburing-2.9 &&
                ./configure --prefix=/usr --libdir=/usr/lib64 \
                    --libdevdir=/usr/lib64 &&
                make -j"$(nproc)" -C src CFLAGS="-O2 -fPIC" &&
                make install CFLAGS="-O2 -fPIC" &&
                rm -f /usr/lib64/liburing.so* /usr/lib64/liburing-ffi.so*
            fi
          CIBW_CONFIG_SETTINGS_LINUX: ${{ matrix.cibw_config_settings || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch || 'multi' }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
