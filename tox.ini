# invoke using test.sh - it takes care of python environments for you.
[tox]

envlist =
    py{310,311,312}-sqlalchemy{2.0}

skipsdist = true

[testenv]

deps =
    sqlalchemy2.0: SQLAlchemy>=2.0.29

commands =
    # --group, not .[test]: "test" is a [dependency-groups] entry, not an
    # extra. Asking for it as an extra is not an error — uv warns "does not
    # have an extra named ..." and installs nothing, so the matrix runs
    # without the very dependencies it is meant to be exercising.
    uv pip install -e . --group test
    # -m selects by marker; -k would also match any test whose *name* happened
    # to contain "portable".
    uv run pytest -m portable
