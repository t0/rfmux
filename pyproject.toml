[build-system]
requires = ["scikit-build-core>=0.3.3", "pybind11", "setuptools-scm>=8.0"]
build-backend = "scikit_build_core.build"

[project]
name = "rfmux"
dynamic = ["version"]
description = "Python library for t0.technology CRS board running rfmux firmware"
readme = "README.md"
authors = [
  {name="Graeme Smecher", email="gsmecher@t0.technology"},
  {name="Joshua Montgomery", email="joshua@t0.technology"},
]
dependencies = [
  "PyQt6",
  "aiohttp",
  "awaitless",
  "click>=8.0",
  # Pulse capture writes its captures as HDF5, and Periscope does so by
  # default, so this is reached by ordinary use rather than an exotic
  # path.
  "h5py",
  # Pin to 6.x for qtconsole in-process kernel compatibility: ipykernel 7.x
  # do_execute dereferences shell_channel_thread.parent_thread, which the
  # in-process kernel (embedded Periscope console) never creates ->
  # AttributeError on every execute. Do NOT let dependabot relax this to <8
  # until the in-process kernel works (see
  # test/periscope/test_embedded_console.py).
  "ipykernel<7",
  "ipython",
  "jupyterlab",
  # Ships jupyterlab_jupytext, which lets JupyterLab open the .md reference
  # notebooks (rfmux/reference-notebooks/) as real notebooks. Without it they
  # are inert markdown, so this is a runtime dependency and not a dev one.
  "jupytext",
  "matplotlib",
  "numba",  # Required for high-performance physics calculations in MockCRS
  "numpy",
  "psutil",
  "pyqtgraph",
  "pytest",
  "pytest-asyncio",
  "pyyaml",
  "qtconsole",
  "requests_futures",
  "scipy",
  "simplejson",
  "sqlalchemy",
  "tuber-client[async]>=0.18",
  # Intel Threading Building Blocks for numba parallel execution.
  # On macOS, you need libomp instead
  "tbb; sys_platform != 'darwin'",
]

# 3.10, not 3.9: rfmux/core/crs.py and test/core/test_spotcheck.py both use
# match/case, so 3.9 cannot even import the package. The floor said ">=3.9"
# for a long time while that was already true — the tox matrix below is what
# keeps this honest, so it must not list a version the code cannot load.
requires-python = ">=3.10"

[project.optional-dependencies]

# pygetdata is not on PyPI, must be installed via system package manager
# Debian/Ubuntu: apt-get install python3-pygetdata
dirfile = []

# Dependencies for "rfmux qc".
qc = [
  "beautifulsoup4",
  "htpy",
  "markdown",
  "markupsafe",
  "pytest_check",
  "requests",
  "scikit-learn",
  "weasyprint",
]

# Dependencies for "rfmux firmware". Optional so the Yocto build (which never
# needs them) doesn't carry extra pre-requisites.
firmware = [
  "pexpect",
  "tqdm",
  "xmodem",
]

[project.scripts]
rfmux = "rfmux.tools.cli:main"
parser = "rfmux.tools.parser:main"

[project.gui-scripts]
periscope = "rfmux.tools.periscope.__main__:main"

[dependency-groups]
# Exactly what the test suite imports beyond the runtime dependencies.
# Kept separate from `dev` so CI can install this and nothing else: the
# qc extra pulls weasyprint, whose native libraries are a liability on
# the Windows and macOS runners, and a test run should not depend on
# them building.
test = [
  "nbclient",
  "nbformat",
  "pytest_check",
]
dev = [
  "rfmux[qc]",  # run the QC suite from a checkout
  {include-group = "test"},
]

[project.urls]
homepage = "https://github.com/t0/rfmux"
repository = "https://github.com/t0/rfmux"

[tool.scikit-build]
cmake.source-dir = "rfmux/streamer"
wheel.packages = ["rfmux"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["rfmux/_version.py"]

[tool.setuptools]
packages = ["rfmux"]

[tool.setuptools_scm]
version_file = "rfmux/_version.py"
fallback_version = "0.0.0"

[tool.uv]
exclude-newer = "3 weeks"

[tool.pytest.ini_options]
# The QC suite (rfmux/tools/qc/) is excluded here; run it via "rfmux qc".
testpaths = ["test"]

markers = [
  # Tiers, in order of what infrastructure they need. See test/README.md.
  "portable: needs no CRS at all and no GUI — the subset tox runs on every supported Python",
  "slow_acquisition: slow (~1 min) because it exercises the data-acquisition path for real — spawns a MockCRS server subprocess and streams UDP over loopback",
  "hardware: needs a real CRS board; applied automatically to anything using the crs/live_session fixtures, and skipped unless --serial is given",

  # The QC suite lives in rfmux/tools/qc/ and runs via "rfmux qc", not from here.
  "qc_stage1",
  "qc_stage2",
]

# Default runs are the fast tier (~20 s). Run the acquisition tier with:
#   pytest -m slow_acquisition test/
addopts = '-m "not slow_acquisition"'

asyncio_default_fixture_loop_scope = "session"
