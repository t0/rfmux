# invoke using test.sh - it takes care of python environments for you.
[tox]

envlist =
    py{39,310,311,312}-sqlalchemy{2.0}

skipsdist = true

[testenv]

deps =
    sqlalchemy2.0: SQLAlchemy>=2.0.29

commands =
    uv pip install -e .[dev]
    # -m selects by marker; -k would also match any test whose *name* happened
    # to contain "portable".
    uv run pytest -m portable
